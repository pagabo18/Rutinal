name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dos trabajos separados (empaquetar y publicar): cuando iban en el mismo, "Deploy" a veces
# consultaba el artefacto menos de un segundo después de subirlo y GitHub aún no lo listaba
# ("No artifacts named github-pages were found"). Además, si falla, se reintenta solo.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: assets/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
