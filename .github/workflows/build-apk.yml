name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created, published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          sed -i "s|/home/user/android-sdk|$ANDROID_SDK_ROOT|g" build.sh
          sed -i "s|/usr/lib/jvm/java-17-openjdk-amd64|$JAVA_HOME|g" build.sh
          sed -i "s|PROJECT_DIR=/home/user/workspace/rutinal|PROJECT_DIR=$PWD|g" build.sh
          chmod +x build.sh
          ./build.sh

      - name: Upload APK artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Rutinal-apk
          path: build/Rutinal.apk

      # Publica "latest" en cada push a main con el APK más reciente
      - name: Update latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última build · ${{ github.sha }}"
          body: "Compilado automáticamente desde `main` (commit ${{ github.sha }})."
          prerelease: true
          files: build/Rutinal.apk

      # Adjunta el APK a cualquier release creado manualmente (v5.0, v5.1, etc.)
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Rutinal.apk
