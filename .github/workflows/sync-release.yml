name: Sync APK to versioned release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. v5.0)"
        required: true
        default: "v5.0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          sed -i "s|/home/user/android-sdk|$ANDROID_SDK_ROOT|g" build.sh
          sed -i "s|/usr/lib/jvm/java-17-openjdk-amd64|$JAVA_HOME|g" build.sh
          sed -i "s|PROJECT_DIR=/home/user/workspace/organizame|PROJECT_DIR=$PWD|g" build.sh
          chmod +x build.sh
          ./build.sh

      - name: Upload APK to release ${{ inputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: build/Organizame.apk
          fail_on_unmatched_files: true
