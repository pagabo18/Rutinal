plugins {
    id 'com.android.application'
}

android {
    namespace "com.pagabo18.rutinal"
    compileSdk 34

    defaultConfig {
        applicationId "com.pagabo18.rutinal"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.5.1"
        resConfigs "es", "en", "pt-rBR", "fr"
    }

    signingConfigs {
        release {
            // Configura estas variables de entorno antes de compilar release:
            //   export RUTINAL_KEYSTORE_PATH=/ruta/a/tu.keystore
            //   export RUTINAL_KEYSTORE_PASS='tu-password'
            def ksPath = System.getenv("RUTINAL_KEYSTORE_PATH")
            def ksPass = System.getenv("RUTINAL_KEYSTORE_PASS")
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "rutinal-upload"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // Sin minify, sin firma (Gradle usa debug.keystore auto)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += ['../../assets']
        }
    }
}

configurations.all {
    resolutionStrategy {
        // Forzar una única versión de kotlin-stdlib para evitar duplicados con jdk7/jdk8
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // CameraX para preview
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // ML Kit para escaneo de códigos de barras
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // Soporte de lifecycle y coroutines para CameraX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
