<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Rutinal · Prototipo de coaching</title>
<style>:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{max-width:780px;margin:auto;padding:24px 16px;line-height:1.5}h1{letter-spacing:-.04em}main{display:grid;gap:18px}.coach-card,section{border:1px solid #9996;border-radius:16px;padding:18px}form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600}input,select,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #8887}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4986db}small{display:block;opacity:.75}.coach-card{display:grid;gap:10px;margin-top:10px}.coach-muted{opacity:.75}aside{border-left:4px solid #c77b19;padding:12px;background:#b8a35c16}</style></head>
<body><header><p><a href="../index.html">← Volver a Rutinal</a></p><h1>Panel de coaching</h1><aside><strong>Prototipo local.</strong> Los datos solo se guardan en este navegador. No hay cuentas, invitaciones ni sincronización real con atletas. No ingreses información médica sensible.</aside></header>
<main><section><h2>Crear o actualizar plan</h2><form id="coach-plan-form"><label>Plan existente (opcional)<select id="coach-plan-id"><option value="">Nuevo plan</option></select></label><label>Tipo<select id="coach-type"><option value="workout">Entrenamiento</option><option value="nutrition">Nutrición</option></select></label><label>Nombre del plan<input id="coach-title" required maxlength="120" placeholder="Torso A / Menú semanal"></label><label>Ejercicios o alimentos (uno por línea)<textarea id="coach-items" rows="6" required placeholder="Press de banca&#10;Remo con mancuerna"></textarea></label><button type="submit">Publicar versión local</button></form><p id="coach-status" role="status" aria-live="polite"></p></section>
<section><h2>Planes publicados</h2><label>Identificador de atleta de prueba<input id="coach-athlete" placeholder="atleta-demo" autocomplete="off"></label><div id="coach-plan-list"></div></section>
<section><h2>Asignaciones locales</h2><div id="coach-assignment-list"></div></section></main>
<script src="plan-core.js"></script><script src="coach-demo.js"></script></body></html>
